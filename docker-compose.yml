services:
  nats:
    #profiles: ["base", "run", "simulation"]
    profiles: ["base"]
    image: nats:latest
    command:
      - "--http_port=8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: unless-stopped

  retain-service:
    profiles: ["run"]
    build:
      context: .
      target: retain-service
    command: ["-db", "/data/retain.db"]
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
      - ./retain-data:/data
    depends_on:
      - nats
    restart: unless-stopped

  simulator:
    profiles: ["simulation"]
    build:
      context: ./simulator/node-red
    ports:
      - "${SIMULATOR_DASHBOARD_PORT:-1880}:1880"
      - "1502:1502"
      - "1503:1503"
      - "1504:1504"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:1880/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  simulator-seed:
    profiles: ["simulation"]
    build:
      context: .
      target: simulator-seed
    command: ["-replicas", "${SIMULATOR_REPLICAS:-100}"]
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
    restart: on-failure

  modbus-service:
    profiles: ["run"]
    build:
      context: .
      target: modbus-service
    depends_on:
      - retain-service
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
    restart: unless-stopped

  alert-service:
    profiles: ["run"]
    build:
      context: .
      target: alert-service
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
    depends_on:
      - retain-service
    restart: unless-stopped

  designer:
    profiles: ["run"]
    build:
      context: .
      target: designer
    ports:
      - "8080:8080"
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
    depends_on:
      - retain-service
    restart: unless-stopped
